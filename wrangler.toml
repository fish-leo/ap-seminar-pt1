name = "ap-seminar-pt1"
main = "worker.mjs"
compatibility_date = "2025-09-01"

# 静态资源目录（index.html / styles.css / app.js）
[assets]
directory = "./site"
binding = "ASSETS"

# 单例 Durable Object：强一致地保存团队状态
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
