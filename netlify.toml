[build]
  publish = "docs"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Netlify Functions（当前推荐写法）
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /api/* → Netlify Function（函数内部按 /api/ 之后的路由分发）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
